name: Project Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.26.2'

    - name: Generate localcertificates
      shell: bash
      run: make certs

    - name: Build the app (unit tests & coverage & integration tests & build)
      shell: bash
      run: make all

    - name: Run e2e tests
      shell: bash
      run: make test-e2e

    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build & push docker image
      shell: bash
      run: make all-services TARGET=docker-push