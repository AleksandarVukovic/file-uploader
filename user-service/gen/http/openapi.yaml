swagger: "2.0"
info:
    title: User Service
    description: Service for handling user-related operations
    version: 0.0.1
host: localhost:8080
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /health:
        get:
            tags:
                - health
            summary: health health
            description: Returns the health status of the service.
            operationId: health#health
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/HealthHealthResponseBody'
                        required:
                            - status
                "500":
                    description: 'internal_error: Fault in the service.'
                    schema:
                        $ref: '#/definitions/HealthHealthInternalErrorResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: internal_error
                            temporary: false
                            timeout: false
                "503":
                    description: 'unavailable: Service unavailable.'
                    schema:
                        $ref: '#/definitions/HealthHealthUnavailableResponseBody'
                    examples:
                        application/vnd.goa.error:
                            fault: false
                            id: 123abc
                            message: parameter 'p' must be an integer
                            name: unavailable
                            temporary: false
                            timeout: false
            schemes:
                - http
definitions:
    HealthHealthInternalErrorResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: true
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: true
        description: Error response result type (default view)
        example:
            fault: true
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: true
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
    HealthHealthResponseBody:
        title: HealthHealthResponseBody
        type: object
        properties:
            status:
                type: string
                description: Health status of the service
                example: ok
        example:
            status: ok
        required:
            - status
    HealthHealthUnavailableResponseBody:
        title: 'Mediatype identifier: application/vnd.goa.error; view=default'
        type: object
        properties:
            fault:
                type: boolean
                description: Is the error a server-side fault?
                example: false
            id:
                type: string
                description: ID is a unique identifier for this particular occurrence of the problem.
                example: 123abc
            message:
                type: string
                description: Message is a human-readable explanation specific to this occurrence of the problem.
                example: parameter 'p' must be an integer
            name:
                type: string
                description: Name is the name of this class of errors.
                example: bad_request
            temporary:
                type: boolean
                description: Is the error temporary?
                example: false
            timeout:
                type: boolean
                description: Is the error a timeout?
                example: false
        description: Error response result type (default view)
        example:
            fault: false
            id: 123abc
            message: parameter 'p' must be an integer
            name: bad_request
            temporary: false
            timeout: false
        required:
            - name
            - id
            - message
            - temporary
            - timeout
            - fault
